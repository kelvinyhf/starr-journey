<!DOCTYPE html>
<html lang="en" class="dark no-scrollbar bg-purple-1" style="opacity: 0">
<head>
  
  <!-- Prevent FOUC -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.documentElement.style.opacity = 100;
    });
  </script>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>Starr Journey</title>
  <meta name="description" content="A casual web game about Starr dodging obstacles, built with KAPLAY">
  <meta name="author" content="KelvinY">
  <link rel="canonical" href="https://starrjourney.pages.dev/">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Starr Journey">
  <meta property="og:description" content="A casual web game about Starr dodging obstacles, built with KAPLAY">
  <!-- <meta property="og:image" content="https://starrjourney.pages.dev/assets/images/open-graph-image.png"> -->
  <meta property="og:url" content="https://starrjourney.pages.dev/">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Starr Journey">
  <meta name="twitter:description" content="A casual web game about Starr dodging obstacles, built with KAPLAY">
  <!-- <meta name="twitter:image" content="https://starrjourney.pages.dev/assets/images/open-graph-image.png"> -->
  
  <!-- iOS Optimization -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#18111b">
  <meta name="format-detection" content="telephone=no">
  
  <!-- External Files -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/images/favicon.svg">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/libraries/radix-colors.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <script>
    const isDevEnv =
      location.hostname === 'localhost' ||
      location.hostname === '127.0.0.1' ||
      location.hostname.endsWith('github.dev');
    
    if (isDevEnv) {
      fetch('./input.css')
        .then(res => res.text())
        .then(cssContent => {
          
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = cssContent;
          document.head.appendChild(style);
          
          const cdnScript = document.createElement('script');
          cdnScript.src = './assets/libraries/tailwindcss.js';
          cdnScript.defer = true;
          document.head.appendChild(cdnScript);
          
        })
        .catch(err => console.error(err));
    } else {
      
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './output.css';
      document.head.appendChild(link);
      
    }
  </script>
  
  <!-- JavaScript -->
  <script type="module" src="./index.js" defer></script>
  
</head>
<body class="no-scrollbar bg-purple-1">
  
  <!-- Loading Screen -->
  <div id="loading-screen" class="pt-[env(safe-area-inset-top)] absolute inset-0 w-full h-full bg-purple-1 z-99 flex justify-center items-center">
    <span class="text-2xl text-center">Loading... :)</span>
  </div>
  
  <!-- Game Canvas -->
  <canvas id="canvas" class="pt-[env(safe-area-inset-top)]"></canvas>

  <!-- Menu UI -->
  <div id="menu-ui" class="pt-[env(safe-area-inset-top)] absolute inset-0 w-full h-full bg-[rgba(0,0,0,0.3)] flex flex-col justify-between items-center">

    <!-- Home Screen -->
    <div class="flex-1 flex flex-col justify-center items-center gap-8 w-full px-6">
      
      <!-- Logo -->
      <div class="flex flex-col items-center gap-2">
        <div class="flex justify-center items-center gap-5">
          <img src="./assets/sprites/statics/crown.png" class="w-8">
          <span class="block text-3xl text-center [-webkit-text-stroke:6px_#000] [paint-order:stroke_fill]"><span class="text-amber-11">Starr</span><br>Journey</span>
          <img src="./assets/sprites/statics/crown.png" class="w-8">
        </div>

        <!-- Tip Label -->
        <span id="tip-label" class="block text-lg text-center"></span>

      </div>

      <!-- Buttons -->
      <div class="flex justify-center items-center gap-5 w-full">

        <!-- Shop -->
        <button id="shop-btn" class="flex flex-col items-center cursor-pointer -mb-6 -rotate-4">
          <img src="./assets/sprites/statics/shop.png" class="-mb-4 w-14 h-14">
          <span class="text-2xl [-webkit-text-stroke:6px_#111] [paint-order:stroke_fill]">Shop</span>
        </button>
        
        <!-- Play -->
        <button id="play-btn" class="flex flex-col items-center cursor-pointer">
          <img src="./assets//sprites/statics/play.png" class="-mb-7 w-21 h-21">
          <span class="text-3xl [-webkit-text-stroke:8px_#111] [paint-order:stroke_fill]">Play</span>
        </button>

        <!-- Credits -->
        <button id="credits-btn" class="flex flex-col items-center cursor-pointer -mb-6 rotate-4">
          <img src="./assets/sprites/statics/credits.png" class="-mb-4.5 w-14 h-14">
          <span class="text-2xl [-webkit-text-stroke:6px_#111] [paint-order:stroke_fill]">Cred</span>
        </button>

      </div>

    </div>

    <!-- Bottom Bar -->
    <div class="flex justify-evenly items-center w-full max-w-xl px-10 py-8">
      
      <!-- Silver Coin Label -->
      <div class="flex justify-between gap-3 items-center">
        <img src="./assets/sprites/silver-coin/frame1.png" class="w-7 h-7">
        <span id="silver-coin-label" class="text-2xl [-webkit-text-stroke:5px_#000] [paint-order:stroke_fill]"></span>
      </div>
      
      <!-- Coin Label -->
      <div class="flex justify-between gap-3 items-center">
        <img src="./assets/sprites/coin/frame1.png" class="w-7 h-7">
        <span id="coin-label" class="text-2xl [-webkit-text-stroke:5px_#000] [paint-order:stroke_fill]"></span>
      </div>
      
    </div>

    <!-- Overlay -->
    <div id="overlay" class="hidden absolute inset-0 w-full h-full bg-[rgba(0,0,0,0.5)] z-98"></div>

    <!-- Shop UI -->
    <div id="shop-ui" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[rgba(0,0,0,0.85)] pixel-frame max-w-sm px-6 pt-0 pb-4 text-center flex flex-col items-center gap-4 z-99">
      <div class="block flex items-center gap-3 text-2xl pixel-frame -mt-4 p-2">
        <span>The Shop</span>
        <img src="./assets/sprites/statics/flag.png" class="w-8 h-8">
      </div>
      
      <!-- Shop items, info, and refresh timer -->
      <div id="shop-items" class="flex justify-center items-center mt-4 bg-[rgba(255,255,255,0.25)] pixel-border"></div>
      <span id="shop-item-info" class="text-md text-gray-9 min-h-[2lh] [-webkit-text-stroke:4px_#000] [paint-order:stroke_fill]">(Click to see info)</span>
      <span id="shop-timer" class="text-xl [-webkit-text-stroke:5px_#000] [paint-order:stroke_fill]">Refresh in 00:00</span>
    </div>

  </div>

  <!-- Game UI -->
  <div id="game-ui" class="pt-[env(safe-area-inset-top)] max-w-xl mx-auto hidden absolute inset-0 w-full h-full pointer-events-none flex flex-col justify-between items-center">
    
    <!-- Top Bar -->
    <div class="flex justify-between items-center w-full p-6">
      
      <!-- Health Bar -->
      <img id="health-bar" src="./assets/sprites/health-bar/100.png" class="w-40">
      
      <!-- Meter Counter -->
      <span id="meter-counter" class="block text-2xl mr-4 [-webkit-text-stroke:5px_#000] [paint-order:stroke_fill]">0m</span>
      
    </div>
    
    <!-- Death Screen UI -->
    <div id="death-screen-ui" class="hidden flex-1 flex justify-center items-center w-full">
      <div class="flex flex-col items-center text-center gap-2 bg-[rgba(0,0,0,0.75)] pixel-frame p-8 m-4">
        <span class="block text-3xl">Game Over.. :(</span>
        <span id="collected-coins-label" class="block text-lg"></span>
        <span id="best-distance" class="block text-lg"></span>
        <button id="retry-btn" class="block text-md text-green-10 pointer-events-auto cursor-pointer">Retry?</button>
      </div>
    </div>

    <!-- Bottom Bar -->
    <div id="bottom-bar" class="flex justify-end items-center gap-2 w-full p-4"></div>
    
  </div>

</body>
</html>
