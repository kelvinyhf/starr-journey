<!DOCTYPE html>
<html lang="en" class="dark no-scrollbar">
<head>
  
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <!-- SEO Meta Tags -->
  <title>Starr Journey</title>
  <meta name="description" content="A casual web game about Starr dodging obstacles, built with KAPLAY">
  <meta name="author" content="KelvinY">
  <link rel="canonical" href="https://starrjourney.pages.dev/">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Starr Journey">
  <meta property="og:description" content="A casual web game about Starr dodging obstacles, built with KAPLAY">
  <!-- <meta property="og:image" content="https://starrjourney.pages.dev/assets/images/open-graph-image.png"> -->
  <meta property="og:url" content="https://starrjourney.pages.dev/">
  <meta property="og:type" content="website">
  
  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Starr Journey">
  <meta name="twitter:description" content="A casual web game about Starr dodging obstacles, built with KAPLAY">
  <!-- <meta name="twitter:image" content="https://starrjourney.pages.dev/assets/images/open-graph-image.png"> -->
  
  <!-- iOS Optimization -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- Safe Area -->
  <meta name="theme-color" content="#18111b">
  <meta name="format-detection" content="telephone=no">
  
  <!-- External Files -->
  <!-- <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/images/favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <link id="apple-touch-icon" rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png"> -->
  
  <!-- CSS -->
  <link rel="stylesheet" href="./assets/libraries/radix-colors.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      fetch('./input.css')
        .then(res => res.text())
        .then(cssContent => {
          
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = cssContent;
          document.head.appendChild(style);
          
          const cdnScript = document.createElement('script');
          cdnScript.src = './assets/libraries/tailwindcss.js';
          cdnScript.defer = true;
          document.head.appendChild(cdnScript);
          
        })
        .catch(err => console.error(err));
    } else {
      
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = './output.css';
      document.head.appendChild(link);
      
    }
  </script>
  
  <!-- JavaScript -->
  <script type="module" src="./main.js" defer></script>
  
</head>
<body class="no-scrollbar">
  <canvas id="canvas"></canvas>

  <!-- Game UI -->
  <div class="absolute inset-0 w-full h-full pointer-events-none p-6 flex flex-col justify-between items-center">

    <!-- Top Bar -->
    <div class="flex justify-between items-center w-full">

      <!-- Health Bar -->
      <div class="flex justify-between items-center bg-gray-1 border-2 border-gray-12 rounded-md p-1 w-48 h-6">
        <div id="health-bar" class="bg-green-10 w-full h-full transition-[width]"></div>
      </div>

      <!-- Coin Label -->
      <div class="flex justify-between gap-3 items-center">
        <img src="./assets/sprites/coin-o.png" class="w-7">
        <span id="coin-label" class="text-2xl">0</span>
      </div>

    </div>

  </div>

</body>
</html>
